<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#3b1d5e"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="30" cy="30" r="1.4" opacity="0.9"/>
    <circle cx="200" cy="24" r="1.2" opacity="0.7"/>
    <circle cx="150" cy="46" r="1" opacity="0.8"/>
    <circle cx="70" cy="18" r="1" opacity="0.6"/>
    <circle cx="210" cy="70" r="1.3" opacity="0.8"/>
  </g>
  <!-- isometric stacked tower, hue drifting turquoise → purple -->
  <g stroke="rgba(0,0,0,0.25)" stroke-width="1">
    <!-- helper: each block = top(light) + front(mid) + side(dark) -->
    <!-- floor 1 -->
    <g transform="translate(96,190)">
      <polygon points="0,0 48,0 62,-12 14,-12" fill="#5eead4"/>
      <rect x="0" y="0" width="48" height="20" fill="#2dd4bf"/>
      <polygon points="48,0 62,-12 62,8 48,20" fill="#0f9488"/>
    </g>
    <!-- floor 2 -->
    <g transform="translate(90,170)">
      <polygon points="0,0 50,0 64,-12 14,-12" fill="#67e8f9"/>
      <rect x="0" y="0" width="50" height="20" fill="#22d3ee"/>
      <polygon points="50,0 64,-12 64,8 50,20" fill="#0e7490"/>
    </g>
    <!-- floor 3 -->
    <g transform="translate(94,150)">
      <polygon points="0,0 46,0 60,-12 14,-12" fill="#93c5fd"/>
      <rect x="0" y="0" width="46" height="20" fill="#3b82f6"/>
      <polygon points="46,0 60,-12 60,8 46,20" fill="#1e40af"/>
    </g>
    <!-- floor 4 -->
    <g transform="translate(98,130)">
      <polygon points="0,0 44,0 58,-12 14,-12" fill="#c4b5fd"/>
      <rect x="0" y="0" width="44" height="20" fill="#8b5cf6"/>
      <polygon points="44,0 58,-12 58,8 44,20" fill="#5b21b6"/>
    </g>
    <!-- floor 5 (perfect glowing) -->
    <g transform="translate(100,110)">
      <polygon points="0,0 42,0 56,-12 14,-12" fill="#f0abfc"/>
      <rect x="0" y="0" width="42" height="20" fill="#d946ef"/>
      <polygon points="42,0 56,-12 56,8 42,20" fill="#86198f"/>
    </g>
  </g>
  <!-- perfect ring on top block -->
  <circle cx="128" cy="112" r="30" fill="none" stroke="#fde047" stroke-width="2.5" opacity="0.85"/>
  <!-- gold sparks -->
  <g fill="#fde047">
    <circle cx="110" cy="96" r="2"/>
    <circle cx="150" cy="100" r="1.6"/>
    <circle cx="132" cy="86" r="1.8"/>
  </g>
  <!-- title badge -->
  <g transform="translate(8,8)">
    <rect width="96" height="24" rx="5" fill="rgba(0,0,0,0.65)"/>
    <text x="48" y="17" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="900" text-anchor="middle" fill="#5eead4">KULE KUR</text>
  </g>
  <!-- score -->
  <g transform="translate(196,206)">
    <text x="0" y="0" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="900" text-anchor="middle" fill="#fde047">47</text>
  </g>
</svg>

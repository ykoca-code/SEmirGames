<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tetris - SEmirK Games</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/icons/logo.svg" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="../../index.html" class="logo">
        <img src="../../assets/icons/logo.svg" alt="SEmirK Games" class="logo-img" />
        <span class="logo-text">SEmirK <span class="logo-accent">Games</span></span>
      </a>
      <div></div>
      <nav class="header-actions">
        <span class="version-badge">v…</span>
        <a href="../../index.html" class="header-link">←</a>
      </nav>
    </div>
  </header>

  <main class="container game-container tetris-container">
    <div class="tetris-top">
      <div class="tetris-stats">
        <div class="t-stat"><span class="t-stat-label">Skor</span><span id="score" class="t-stat-value">0</span></div>
        <div class="t-stat"><span class="t-stat-label">Satır</span><span id="lines" class="t-stat-value">0</span></div>
        <div class="t-stat"><span class="t-stat-label">Sev</span><span id="level" class="t-stat-value">1</span></div>
      </div>
      <div class="tetris-previews">
        <div class="preview-block">
          <span class="preview-label">Sıradaki</span>
          <canvas id="next" width="80" height="80"></canvas>
        </div>
        <div class="preview-block">
          <span class="preview-label">Bekleyen</span>
          <canvas id="hold" width="80" height="80"></canvas>
        </div>
      </div>
    </div>

    <div class="tetris-stage">
      <canvas id="board" width="300" height="600" aria-label="Tetris tahtası"></canvas>
      <div id="overlay" class="overlay hidden">
        <div class="overlay-content">
          <h2 id="overlayTitle">Hazır mısın?</h2>
          <p id="overlayText">Başlamak için "Yeni Oyun" tuşuna bas.</p>
          <button type="button" id="overlayBtn" class="btn btn-primary">Yeni Oyun</button>
        </div>
      </div>
    </div>

    <section class="touch-controls" aria-label="Dokunmatik kontroller">
      <button type="button" data-action="left" class="touch-btn">←</button>
      <button type="button" data-action="rotate" class="touch-btn">⟳</button>
      <button type="button" data-action="right" class="touch-btn">→</button>
      <button type="button" data-action="soft" class="touch-btn">↓</button>
      <button type="button" data-action="hard" class="touch-btn">⤓</button>
      <button type="button" data-action="hold" class="touch-btn">B</button>
    </section>

    <div class="action-row">
      <button type="button" id="newGameBtn" class="btn btn-primary">Yeni Oyun</button>
      <button type="button" id="pauseBtn" class="btn">Duraklat</button>
    </div>
  </main>

  <script src="../../js/version.js"></script>
  <script src="script.js"></script>
</body>
</html>

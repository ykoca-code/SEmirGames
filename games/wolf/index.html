<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Kurt Maceraları - SEmirK Games</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/icons/logo.svg" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="wolf-page">
  <a href="../../index.html" class="game-back-fab" aria-label="Tüm Oyunlar">←</a>

  <main class="container game-container wolf-container">
    <div class="wolf-hud">
      <div class="w-stat"><span class="w-label">Seviye</span><span id="level" class="w-value">1</span></div>
      <div class="w-stat"><span class="w-label">Yıldız</span><span id="stars" class="w-value">0/3</span></div>
      <div class="w-stat"><span class="w-label">Can</span><span id="lives" class="w-value">❤❤❤</span></div>
      <div class="w-stat"><span class="w-label">Skor</span><span id="score" class="w-value">0</span></div>
    </div>

    <div class="wolf-stage">
      <canvas id="board" width="320" height="500" aria-label="Kurt oyun sahnesi"></canvas>
      <div id="overlay" class="overlay hidden">
        <div class="overlay-content">
          <h2 id="overlayTitle">Kurt Maceraları</h2>
          <p id="overlayText">Yıldızları topla ve çıkışa ulaş!
Sürükle: hareket et · Dokun: zıpla (havada bir kez daha = çift zıplama)
🚩 Bayrağa dokun: checkpoint — düşersen oradan devam edersin!</p>
          <div class="lb-slot" id="leaderboardSlot"></div>
          <button type="button" id="overlayBtn" class="btn btn-primary">Başla</button>
        </div>
      </div>
    </div>

    <div class="action-row">
      <button type="button" id="newGameBtn" class="btn btn-primary">Yeni Oyun</button>
      <button type="button" id="pauseBtn" class="btn">Duraklat</button>
    </div>
  </main>

  <script src="../../js/vendor/three.min.js?v=1.25.0"></script>
  <script src="../../js/version.js?v=1.25.0"></script>
  <script src="../../js/pwa-back.js?v=1.25.0"></script>
  <script src="../../js/leaderboard.js?v=1.25.0"></script>
  <script src="script.js?v=1.25.0"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <rect width="240" height="240" fill="#0d0f18"/>
  <!-- piled rainbow sand mounds (layered) -->
  <defs>
    <clipPath id="frame"><rect width="240" height="240" rx="0"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <!-- bottom fill layers -->
    <path d="M0,240 L0,200 Q60,160 120,190 Q180,220 240,180 L240,240 Z" fill="#ef4444"/>
    <path d="M0,240 L0,214 Q70,188 130,206 Q190,224 240,200 L240,240 Z" fill="#f59e0b"/>
    <path d="M0,240 L0,224 Q80,206 140,218 Q200,230 240,214 L240,240 Z" fill="#84cc16"/>
    <path d="M0,240 L0,232 Q90,220 150,228 Q205,235 240,226 L240,240 Z" fill="#06b6d4"/>
    <!-- a mound in the middle -->
    <path d="M75,240 Q120,150 165,240 Z" fill="#a855f7"/>
    <path d="M90,240 Q120,180 150,240 Z" fill="#ec4899"/>
  </g>
  <!-- falling sand stream from a finger -->
  <g fill="#fde047">
    <rect x="116" y="30" width="4" height="4"/>
    <rect x="120" y="42" width="4" height="4"/>
    <rect x="114" y="54" width="4" height="4"/>
    <rect x="122" y="66" width="4" height="4"/>
    <rect x="116" y="80" width="4" height="4"/>
    <rect x="120" y="96" width="4" height="4"/>
    <rect x="118" y="112" width="4" height="4"/>
  </g>
  <!-- finger/hand hint -->
  <text x="120" y="28" font-size="22" text-anchor="middle">👆</text>
  <!-- title badge -->
  <g transform="translate(8,8)">
    <rect width="108" height="24" rx="5" fill="rgba(0,0,0,0.6)"/>
    <text x="54" y="17" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="900" text-anchor="middle" fill="#fde047">KUM BOYAMA</text>
  </g>
</svg>

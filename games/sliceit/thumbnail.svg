<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="orange" cx="40%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fed7aa"/>
      <stop offset="0.4" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#9a3412"/>
    </radialGradient>
  </defs>
  <rect width="240" height="240" fill="url(#bg)"/>
  <!-- camera preview shape (silhouette suggesting a face) -->
  <g opacity="0.35">
    <circle cx="120" cy="135" r="60" fill="#475569"/>
    <ellipse cx="120" cy="200" rx="80" ry="40" fill="#334155"/>
    <!-- eyes -->
    <ellipse cx="100" cy="120" rx="6" ry="3" fill="#1f2937"/>
    <ellipse cx="140" cy="120" rx="6" ry="3" fill="#1f2937"/>
  </g>
  <!-- orange centered -->
  <g transform="translate(120,120)">
    <circle r="42" fill="url(#orange)" stroke="#7c2d12" stroke-width="2"/>
    <!-- texture dots -->
    <g fill="rgba(124,45,18,0.35)">
      <circle cx="-12" cy="-10" r="2"/>
      <circle cx="8" cy="-15" r="2"/>
      <circle cx="20" cy="5" r="2"/>
      <circle cx="-22" cy="10" r="2"/>
      <circle cx="5" cy="18" r="2"/>
      <circle cx="-5" cy="-22" r="2"/>
    </g>
    <!-- leaf -->
    <ellipse cx="3" cy="-40" rx="9" ry="4" fill="#16a34a" transform="rotate(-30 0 -40)"/>
    <ellipse cx="-2" cy="-44" rx="6" ry="3" fill="#22c55e" transform="rotate(-50 0 -40)"/>
    <!-- highlight -->
    <ellipse cx="-15" cy="-15" rx="8" ry="5" fill="rgba(255,255,255,0.4)"/>
  </g>
  <!-- knife swinging -->
  <g transform="translate(70,90) rotate(-25)">
    <rect x="0" y="0" width="60" height="6" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
    <polygon points="60,0 80,3 60,6" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
    <rect x="-20" y="-1" width="20" height="8" rx="2" fill="#92400e" stroke="#451a03"/>
    <!-- shine -->
    <line x1="5" y1="2" x2="55" y2="2" stroke="#fff" stroke-width="1" opacity="0.6"/>
  </g>
  <!-- slash effect -->
  <path d="M 60 80 Q 130 95 200 65" stroke="#fde047" stroke-width="3" fill="none" opacity="0.7" stroke-linecap="round"/>
  <!-- score badge -->
  <g transform="translate(8,8)">
    <rect width="86" height="22" rx="4" fill="rgba(0,0,0,0.75)"/>
    <text x="43" y="16" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="900" text-anchor="middle" fill="#fde047">DİLİM 12</text>
  </g>
  <!-- eye blink hint bottom -->
  <g transform="translate(120,220)">
    <text x="0" y="0" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="800" text-anchor="middle" fill="#94a3b8">👁️ KIRP → KES</text>
  </g>
</svg>

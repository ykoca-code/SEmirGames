<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#16213a"/>
      <stop offset="1" stop-color="#0d1117"/>
    </radialGradient>
    <linearGradient id="tileFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffef0"/>
      <stop offset="1" stop-color="#f0ecc0"/>
    </linearGradient>
    <filter id="glowBlue" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="240" height="240" fill="url(#bg)"/>
  <!-- CRT scanlines -->
  <g opacity="0.18">
    <rect y="10" width="240" height="2" fill="#000"/><rect y="30" width="240" height="2" fill="#000"/>
    <rect y="50" width="240" height="2" fill="#000"/><rect y="70" width="240" height="2" fill="#000"/>
    <rect y="90" width="240" height="2" fill="#000"/><rect y="110" width="240" height="2" fill="#000"/>
    <rect y="130" width="240" height="2" fill="#000"/><rect y="150" width="240" height="2" fill="#000"/>
    <rect y="170" width="240" height="2" fill="#000"/><rect y="190" width="240" height="2" fill="#000"/>
    <rect y="210" width="240" height="2" fill="#000"/><rect y="230" width="240" height="2" fill="#000"/>
  </g>
  <!-- Okey tiles fanned out -->
  <g transform="translate(48 108) rotate(-12)">
    <rect x="-3" y="-3" width="52" height="76" rx="8" fill="#00f3ff" opacity="0.5"/>
    <rect width="46" height="70" rx="7" fill="url(#tileFace)"/>
    <text x="23" y="46" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#e53935" text-anchor="middle">5</text>
  </g>
  <g transform="translate(96 96) rotate(-2)">
    <rect x="-3" y="-3" width="52" height="76" rx="8" fill="#b026ff" opacity="0.5"/>
    <rect width="46" height="70" rx="7" fill="url(#tileFace)"/>
    <text x="23" y="46" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1e88e5" text-anchor="middle">6</text>
  </g>
  <g transform="translate(144 94) rotate(9)">
    <rect x="-3" y="-3" width="52" height="76" rx="8" fill="#ffd700" opacity="0.6"/>
    <rect width="46" height="70" rx="7" fill="url(#tileFace)"/>
    <text x="23" y="46" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#212121" text-anchor="middle">7</text>
    <text x="42" y="14" font-family="Arial, sans-serif" font-size="16" fill="#c8a400" text-anchor="middle">★</text>
  </g>
  <!-- Title -->
  <text x="120" y="52" font-family="'Courier New', monospace" font-size="30" font-weight="bold"
        fill="#00f3ff" text-anchor="middle" filter="url(#glowBlue)" letter-spacing="2">OKEYTRO</text>
  <!-- Score line -->
  <text x="120" y="210" font-family="'Courier New', monospace" font-size="15" font-weight="bold"
        fill="#00ff66" text-anchor="middle" opacity="0.9">10 + 18 Çip × 1.5 = 42</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0c4a6e"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" fill="url(#bg)"/>
  <g font-family="Helvetica,Arial,sans-serif" font-weight="800" text-anchor="middle">
    <!-- target circle -->
    <circle cx="200" cy="40" r="28" fill="#fbbf24" stroke="#fff" stroke-width="3"/>
    <text x="200" y="50" font-size="24" fill="#1e3a8a">11</text>
    <!-- 4x4 grid -->
    <g stroke="#fff" stroke-width="2" fill="#fff" fill-opacity="0.12">
      <rect x="20"  y="80"  width="40" height="40"/>
      <rect x="60"  y="80"  width="40" height="40"/>
      <rect x="100" y="80"  width="40" height="40"/>
      <rect x="140" y="80"  width="40" height="40"/>
      <rect x="20"  y="120" width="40" height="40"/>
      <rect x="60"  y="120" width="40" height="40"/>
      <rect x="100" y="120" width="40" height="40"/>
      <rect x="140" y="120" width="40" height="40"/>
      <rect x="20"  y="160" width="40" height="40"/>
      <rect x="60"  y="160" width="40" height="40"/>
      <rect x="100" y="160" width="40" height="40"/>
      <rect x="140" y="160" width="40" height="40"/>
    </g>
    <!-- highlighted path 5+2+1+3 = 11 -->
    <g fill="#ef4444" fill-opacity="0.85" stroke="#fff" stroke-width="2">
      <rect x="60"  y="80"  width="40" height="40"/>
      <rect x="100" y="80"  width="40" height="40"/>
      <rect x="140" y="80"  width="40" height="40"/>
      <rect x="60"  y="120" width="40" height="40"/>
    </g>
    <g fill="#fff" font-size="22">
      <text x="40"  y="108">1</text>
      <text x="80"  y="108">5</text>
      <text x="120" y="108">2</text>
      <text x="160" y="108">1</text>
      <text x="40"  y="148">8</text>
      <text x="80"  y="148">3</text>
      <text x="120" y="148">7</text>
      <text x="160" y="148">4</text>
      <text x="40"  y="188">2</text>
      <text x="80"  y="188">9</text>
      <text x="120" y="188">6</text>
      <text x="160" y="188">5</text>
    </g>
    <!-- score badge -->
    <g>
      <rect x="80" y="210" width="80" height="22" rx="10" fill="#10b981"/>
      <text x="120" y="226" font-size="14" fill="#fff">+4 puan</text>
    </g>
  </g>
</svg>

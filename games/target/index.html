<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Hedef Sayı - SEmirK Games</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/icons/logo.svg" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="target-page">
  <a href="../../index.html" class="game-back-fab" aria-label="Tüm Oyunlar">←</a>

  <main class="container game-container target-container">
    <div class="scoreboard">
      <div class="player p1" id="p1Box">
        <div class="p-label">1. Oyuncu</div>
        <div class="p-score" id="p1Score">0</div>
      </div>
      <div class="target-display">
        <div class="t-label">HEDEF</div>
        <div class="t-value" id="targetValue">11</div>
      </div>
      <div class="player p2" id="p2Box">
        <div class="p-label">2. Oyuncu</div>
        <div class="p-score" id="p2Score">0</div>
      </div>
    </div>

    <div class="board-wrap">
      <div id="board" class="target-board" aria-label="Hedef tahta"></div>
    </div>

    <div class="run-bar">
      <span class="run-label">Toplam</span>
      <span class="run-value">
        <span id="runSum">0</span> / <span id="runTarget">11</span>
      </span>
    </div>

    <div class="action-row">
      <button type="button" id="clearBtn" class="btn">Temizle</button>
      <button type="button" id="confirmBtn" class="btn btn-primary" disabled>Onayla</button>
      <button type="button" id="passBtn" class="btn">Geç</button>
    </div>

    <div class="meta-row">
      <select id="sizeSelect" class="size-select">
        <option value="5">5×5</option>
        <option value="6" selected>6×6</option>
        <option value="7">7×7</option>
      </select>
      <button type="button" id="newGameBtn" class="btn">Yeni Oyun</button>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-content">
        <h2 id="overlayTitle">Hedef Sayı</h2>
        <p id="overlayText">2 kişilik. Sırayla oynayın. Hedef sayıya komşu karelerin toplamı kadar ulaşan oyuncu, kullandığı kare sayısı kadar puan kazanır. En fazla kareyle ulaşan kazanır!</p>
        <button type="button" id="overlayBtn" class="btn btn-primary">Başla</button>
      </div>
    </div>
  </main>

  <script src="../../js/version.js?v=1.16.0"></script>
  <script src="script.js"></script>
</body>
</html>

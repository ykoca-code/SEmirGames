<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sıcak Soğuk Ülke - SEmirK Games</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/icons/logo.svg" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="worldle-page">
  <a href="../../index.html" class="game-back-fab" aria-label="Tüm Oyunlar">←</a>

  <main class="container game-container worldle-container">
    <div class="w-top">
      <div class="w-stat"><span class="w-stat-label">Tahmin</span><span id="guessNum" class="w-stat-value">0/10</span></div>
      <div class="w-stat"><span class="w-stat-label">Skor</span><span id="score" class="w-stat-value">0</span></div>
      <div class="w-stat"><span class="w-stat-label">Rekor</span><span id="best" class="w-stat-value">0</span></div>
    </div>

    <div class="map-toggle-row">
      <label class="map-toggle">
        <input type="checkbox" id="mapToggle" />
        <span>🗺️ Haritada göster</span>
      </label>
    </div>

    <div class="w-map hidden" id="mapWrap">
      <svg id="mapSvg" viewBox="0 0 720 360" preserveAspectRatio="xMidYMid meet" aria-label="Dünya haritası">
        <defs>
          <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0c2a3f"/>
            <stop offset="1" stop-color="#0a1d2e"/>
          </linearGradient>
          <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
            <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
          </pattern>
        </defs>
        <rect x="0" y="0" width="720" height="360" fill="url(#sea)"/>
        <rect x="0" y="0" width="720" height="360" fill="url(#grid)"/>

        <!-- Equator & meridian guides -->
        <line x1="0" y1="180" x2="720" y2="180" stroke="rgba(255,255,255,0.08)" stroke-width="0.6" stroke-dasharray="3 3"/>
        <line x1="360" y1="0" x2="360" y2="360" stroke="rgba(255,255,255,0.08)" stroke-width="0.6" stroke-dasharray="3 3"/>

        <g fill="#1e4a5e" stroke="#0c2a3f" stroke-width="0.6" stroke-linejoin="round">
          <!-- NORTH AMERICA -->
          <path d="M 60,60 L 100,52 L 150,50 L 200,55 L 240,52 L 270,58 L 290,68 L 280,80 L 250,90 L 230,108 L 240,128 L 230,148 L 210,160 L 195,180 L 178,190 L 175,178 L 165,175 L 158,160 L 168,148 L 158,132 L 138,128 L 122,138 L 105,150 L 88,160 L 75,150 L 68,135 L 62,115 L 58,95 L 55,75 Z"/>
          <!-- Florida + Yucatan + Cuba -->
          <path d="M 210,160 L 218,176 L 215,188 L 208,184 L 205,172 Z"/>
          <path d="M 192,196 L 205,200 L 210,210 L 200,212 L 188,206 Z"/>
          <!-- Central America narrow strip -->
          <path d="M 195,210 L 215,218 L 232,234 L 240,252 L 232,256 L 218,246 L 205,232 L 198,220 Z"/>

          <!-- SOUTH AMERICA -->
          <path d="M 232,256 L 252,254 L 268,266 L 280,282 L 286,302 L 282,322 L 274,338 L 260,346 L 252,338 L 242,320 L 236,300 L 232,282 Z"/>
          <!-- Brazil bulge -->
          <path d="M 268,266 L 295,266 L 312,278 L 318,294 L 308,308 L 294,302 L 282,292 Z"/>
          <!-- Patagonia -->
          <path d="M 252,338 L 258,348 L 254,354 L 248,348 Z"/>

          <!-- GREENLAND -->
          <path d="M 290,30 L 320,28 L 332,40 L 330,58 L 318,68 L 302,62 L 292,48 Z"/>

          <!-- EUROPE -->
          <path d="M 348,70 L 372,68 L 394,72 L 408,80 L 412,92 L 402,102 L 388,108 L 376,105 L 362,98 L 350,86 Z"/>
          <!-- Scandinavia -->
          <path d="M 392,40 L 405,42 L 418,52 L 412,68 L 400,68 L 394,58 Z"/>
          <!-- Italy boot -->
          <path d="M 405,108 L 412,108 L 416,124 L 412,134 L 408,126 L 405,116 Z"/>
          <!-- Iberian -->
          <path d="M 342,108 L 358,108 L 366,120 L 360,128 L 348,128 L 340,118 Z"/>
          <!-- UK & Ireland -->
          <path d="M 358,75 L 366,72 L 372,82 L 368,95 L 358,92 Z"/>
          <path d="M 346,84 L 354,82 L 356,92 L 348,94 Z"/>

          <!-- AFRICA -->
          <path d="M 358,138 L 388,134 L 412,138 L 432,148 L 444,166 L 448,186 L 446,206 L 438,226 L 426,244 L 412,258 L 398,266 L 384,262 L 372,250 L 364,232 L 358,212 L 354,192 L 354,172 Z"/>
          <!-- Madagascar -->
          <path d="M 458,240 L 466,246 L 464,260 L 458,258 L 456,248 Z"/>
          <!-- Horn of Africa -->
          <path d="M 448,186 L 460,184 L 462,194 L 452,196 Z"/>

          <!-- MIDDLE EAST -->
          <path d="M 432,148 L 452,140 L 470,148 L 478,160 L 472,174 L 462,180 L 448,178 L 438,168 Z"/>

          <!-- CENTRAL & SOUTH ASIA -->
          <path d="M 472,108 L 502,102 L 528,108 L 546,118 L 554,132 L 548,144 L 530,150 L 510,148 L 488,142 L 478,130 Z"/>
          <!-- Arabian peninsula already drawn as Middle East -->
          <!-- India triangle -->
          <path d="M 508,168 L 530,172 L 538,184 L 528,202 L 518,208 L 512,196 L 506,180 Z"/>

          <!-- EAST ASIA -->
          <path d="M 548,108 L 592,104 L 622,112 L 642,128 L 648,148 L 638,164 L 618,170 L 596,168 L 578,158 L 558,144 L 552,128 Z"/>
          <!-- Japan -->
          <path d="M 650,118 L 658,124 L 660,140 L 654,148 L 650,140 L 648,128 Z"/>
          <!-- Korean peninsula -->
          <path d="M 624,134 L 632,136 L 634,150 L 626,152 Z"/>

          <!-- SOUTHEAST ASIA -->
          <path d="M 568,178 L 588,176 L 602,184 L 608,196 L 600,206 L 586,208 L 574,200 Z"/>
          <!-- Indonesia archipelago -->
          <path d="M 588,208 L 612,212 L 626,218 L 618,228 L 600,228 L 588,222 Z"/>
          <path d="M 628,222 L 642,224 L 644,232 L 632,232 Z"/>
          <!-- Philippines -->
          <path d="M 614,196 L 624,196 L 626,206 L 618,210 L 614,206 Z"/>

          <!-- AUSTRALIA -->
          <path d="M 600,256 L 632,250 L 660,254 L 678,266 L 680,282 L 668,294 L 644,300 L 620,298 L 602,290 L 594,278 Z"/>
          <!-- Tasmania -->
          <path d="M 642,304 L 652,304 L 654,312 L 644,312 Z"/>
          <!-- New Zealand -->
          <path d="M 686,294 L 694,298 L 696,310 L 688,310 Z"/>
          <path d="M 692,316 L 698,318 L 700,328 L 692,328 Z"/>

          <!-- ANTARCTICA hint -->
          <path d="M 200,348 L 720,348 L 720,360 L 0,360 L 0,348 L 80,348 Z" opacity="0.6"/>
        </g>

        <g id="mapGuesses"></g>
      </svg>
    </div>

    <div class="w-stage">
      <div class="w-guesses" id="guesses"></div>
    </div>

    <div class="w-input-wrap">
      <input type="text" id="search" class="w-search" placeholder="Ülke yaz..." autocomplete="off" />
      <div id="suggest" class="w-suggest hidden"></div>
    </div>

    <div class="action-row">
      <button type="button" id="newGameBtn" class="btn btn-primary">Yeni Oyun</button>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-content">
        <h2 id="overlayTitle">Sıcak Soğuk Ülke</h2>
        <p id="overlayText">Bilgisayar bir ülke seçer. Her tahminde sana mesafe ve yön söylenir. 10 hakkın var, en az tahminle bul!</p>
        <div class="lb-slot" id="leaderboardSlot"></div>
        <button type="button" id="overlayBtn" class="btn btn-primary">Başla</button>
      </div>
    </div>
  </main>

  <script src="../../js/version.js?v=1.22.0"></script>
  <script src="../../js/leaderboard.js?v=1.22.0"></script>
  <script src="../flags/countries.js?v=1.22.0"></script>
  <script src="script.js?v=1.22.0"></script>
</body>
</html>

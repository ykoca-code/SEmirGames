<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <rect width="240" height="240" fill="#f5f7fb"/>
  <!-- 5x5 grid -->
  <g fill="#ffffff" stroke="#d4d8e0" stroke-width="1">
    <rect x="20" y="20" width="40" height="40" rx="6"/>
    <rect x="62" y="20" width="40" height="40" rx="6"/>
    <rect x="104" y="20" width="40" height="40" rx="6"/>
    <rect x="146" y="20" width="40" height="40" rx="6"/>
    <rect x="188" y="20" width="32" height="40" rx="6"/>
    <rect x="20" y="62" width="40" height="40" rx="6"/>
    <rect x="62" y="62" width="40" height="40" rx="6"/>
    <rect x="104" y="62" width="40" height="40" rx="6"/>
    <rect x="146" y="62" width="40" height="40" rx="6"/>
    <rect x="188" y="62" width="32" height="40" rx="6"/>
    <rect x="20" y="104" width="40" height="40" rx="6"/>
    <rect x="62" y="104" width="40" height="40" rx="6"/>
    <rect x="104" y="104" width="40" height="40" rx="6"/>
    <rect x="146" y="104" width="40" height="40" rx="6"/>
    <rect x="188" y="104" width="32" height="40" rx="6"/>
    <rect x="20" y="146" width="40" height="40" rx="6"/>
    <rect x="62" y="146" width="40" height="40" rx="6"/>
    <rect x="104" y="146" width="40" height="40" rx="6"/>
    <rect x="146" y="146" width="40" height="40" rx="6"/>
    <rect x="188" y="146" width="32" height="40" rx="6"/>
  </g>
  <!-- path: spiral-ish through the grid, gradient stroke -->
  <defs>
    <linearGradient id="pathGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <path d="M 40 40 L 82 40 L 124 40 L 166 40
           L 166 82 L 124 82 L 82 82 L 82 124
           L 124 124 L 166 124 L 204 124 L 204 82
           L 204 166 L 166 166 L 124 166 L 82 166 L 40 166
           L 40 124 L 40 82"
        fill="none" stroke="url(#pathGrad)" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <!-- checkpoints 1..5 -->
  <g>
    <circle cx="40" cy="40" r="13" fill="#0f172a"/>
    <text x="40" y="44" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="900" text-anchor="middle" fill="#fff">1</text>
    <circle cx="82" cy="82" r="13" fill="#0f172a"/>
    <text x="82" y="86" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="900" text-anchor="middle" fill="#fff">2</text>
    <circle cx="204" cy="124" r="13" fill="#0f172a"/>
    <text x="204" y="128" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="900" text-anchor="middle" fill="#fff">3</text>
    <circle cx="40" cy="166" r="13" fill="#0f172a"/>
    <text x="40" y="170" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="900" text-anchor="middle" fill="#fff">4</text>
    <circle cx="40" cy="82" r="13" fill="#0f172a"/>
    <text x="40" y="86" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="900" text-anchor="middle" fill="#fff">5</text>
  </g>
  <!-- level badge -->
  <g transform="translate(8,208)">
    <rect width="86" height="24" rx="6" fill="#1f2937"/>
    <text x="43" y="17" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="900" text-anchor="middle" fill="#fde047">BÖLÜM 1/50</text>
  </g>
</svg>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>İngilizce Kelimeler - SEmirK Games</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/icons/logo.svg" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="english-page">
  <a href="../../index.html" class="game-back-fab" aria-label="Tüm Oyunlar">←</a>
  <header class="site-header">
    <div class="header-inner">
      <a href="../../index.html" class="logo">
        <picture>
          <source srcset="../../assets/icons/SemirkLogo.png?v=1.41.0" type="image/png" />
          <img src="../../assets/icons/logo.svg" alt="SEmirKGames" class="logo-img" />
        </picture>
        <span class="logo-text">SEmirK<span class="logo-accent">Games</span></span>
      </a>
      <div></div>
      <nav class="header-actions">
        <span class="version-badge">v…</span>
        <a href="../../index.html" class="header-link">←</a>
      </nav>
    </div>
  </header>

  <main class="container game-container english-container">
    <div class="english-top">
      <div class="en-stat">
        <span class="en-stat-label">Soru</span>
        <span id="qNum" class="en-stat-value">0/10</span>
      </div>
      <div class="en-stat">
        <span class="en-stat-label">Skor</span>
        <span id="score" class="en-stat-value">0</span>
      </div>
      <div class="en-stat">
        <span class="en-stat-label">Seri</span>
        <span id="streak" class="en-stat-value">0</span>
      </div>
      <div class="en-stat">
        <span class="en-stat-label">Rekor</span>
        <span id="best" class="en-stat-value">0</span>
      </div>
    </div>

    <div class="english-stage">
      <div class="cat-pill" id="catPill">…</div>
      <div class="word-display">
        <div class="word-emoji" id="wordEmoji">🎮</div>
        <div class="word-en" id="wordEn">…</div>
      </div>
      <div class="prompt-text">Türkçesi hangisi?</div>
    </div>

    <div class="choices" id="choices">
      <button type="button" class="choice" data-idx="0">…</button>
      <button type="button" class="choice" data-idx="1">…</button>
      <button type="button" class="choice" data-idx="2">…</button>
      <button type="button" class="choice" data-idx="3">…</button>
    </div>

    <div class="action-row">
      <button type="button" id="newGameBtn" class="btn btn-primary">Yeni Oyun</button>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-content">
        <h2 id="overlayTitle">İngilizce Kelimeler</h2>
        <p id="overlayText">İngilizce kelimenin Türkçesini seç. İlkokul seviyesi: hayvanlar, renkler, sayılar, yiyecekler, aile, vücut, okul ve daha fazlası.</p>
        <div class="category-select">
          <div class="cat-label">Kategori</div>
          <div class="cat-chips" id="catChips"></div>
        </div>
        <div class="category-select">
          <div class="cat-label">Resim</div>
          <div class="cat-chips" id="picChips">
            <button type="button" class="cat-chip active" data-pic="on">🖼️ Resimli</button>
            <button type="button" class="cat-chip" data-pic="off">🚫 Resimsiz (Zor)</button>
          </div>
        </div>
        <div class="lb-slot" id="leaderboardSlot"></div>
        <button type="button" id="overlayBtn" class="btn btn-primary">Başla</button>
      </div>
    </div>
  </main>

  <script src="../../js/version.js?v=1.41.0"></script>
  <script src="../../js/pwa-back.js?v=1.41.0"></script>
  <script src="../../js/leaderboard.js?v=1.41.0"></script>
  <script src="words.js"></script>
  <script src="script.js?v=1.41.0"></script>
</body>
</html>

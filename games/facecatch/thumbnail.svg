<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#fff" opacity="0.65">
    <rect x="20" y="40" width="2" height="2"/>
    <rect x="200" y="30" width="2" height="2"/>
    <rect x="60" y="20" width="1.5" height="1.5"/>
    <rect x="180" y="55" width="1.5" height="1.5"/>
  </g>
  <!-- camera preview frame -->
  <g transform="translate(168,10)">
    <rect width="62" height="48" rx="6" fill="rgba(0,0,0,0.7)" stroke="#fff" stroke-width="1.5"/>
    <text x="31" y="20" font-family="Helvetica,Arial,sans-serif" font-size="8" text-anchor="middle" fill="#86efac">🎥 CAM</text>
    <circle cx="31" cy="30" r="8" fill="#fde68a"/>
    <ellipse cx="28" cy="29" rx="1.2" ry="1.5" fill="#1f2937"/>
    <ellipse cx="34" cy="29" rx="1.2" ry="1.5" fill="#1f2937"/>
    <path d="M 26 33 Q 31 36 36 33" stroke="#1f2937" stroke-width="1" fill="none"/>
  </g>
  <!-- falling fruits -->
  <text x="40" y="80" font-size="22">🍎</text>
  <text x="100" y="60" font-size="22">🍌</text>
  <text x="150" y="100" font-size="22">🍇</text>
  <text x="190" y="130" font-size="20">🍒</text>
  <text x="70" y="130" font-size="20">🥦</text>
  <!-- bad food -->
  <text x="125" y="160" font-size="20">🍩</text>
  <text x="30" y="160" font-size="20">💣</text>
  <!-- basket + child face -->
  <g transform="translate(95,170)">
    <!-- face -->
    <circle cx="25" cy="0" r="18" fill="#fde68a" stroke="#1f2937" stroke-width="1.5"/>
    <!-- hair -->
    <path d="M 7 -3 Q 25 -22 43 -3 L 43 -8 L 7 -8 Z" fill="#1f2937"/>
    <!-- eyes -->
    <circle cx="19" cy="-2" r="2" fill="#1f2937"/>
    <circle cx="31" cy="-2" r="2" fill="#1f2937"/>
    <!-- smile -->
    <path d="M 17 6 Q 25 12 33 6" stroke="#1f2937" stroke-width="1.5" fill="none"/>
    <!-- basket -->
    <path d="M 0 22 L 50 22 L 45 50 L 5 50 Z" fill="#a16207" stroke="#1f2937" stroke-width="1.5"/>
    <line x1="10" y1="22" x2="12" y2="50" stroke="#1f2937" stroke-width="0.8"/>
    <line x1="20" y1="22" x2="21" y2="50" stroke="#1f2937" stroke-width="0.8"/>
    <line x1="30" y1="22" x2="29" y2="50" stroke="#1f2937" stroke-width="0.8"/>
    <line x1="40" y1="22" x2="38" y2="50" stroke="#1f2937" stroke-width="0.8"/>
  </g>
  <!-- score badge -->
  <g transform="translate(8,8)">
    <rect width="84" height="22" rx="4" fill="rgba(0,0,0,0.65)"/>
    <text x="42" y="16" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="900" text-anchor="middle" fill="#fde047">SKOR 240</text>
  </g>
</svg>

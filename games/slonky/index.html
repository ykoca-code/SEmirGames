<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Slonky - SEmirK Games</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/icons/logo.svg" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="slonky-page">
  <a href="../../index.html" class="game-back-fab" aria-label="Tüm Oyunlar">←</a>
  <header class="site-header">
    <div class="header-inner">
      <a href="../../index.html" class="logo">
        <picture>
          <source srcset="../../assets/icons/SemirkLogo.png" type="image/png" />
          <img src="../../assets/icons/logo.svg" alt="SEmirK Games" class="logo-img" />
        </picture>
        <span class="logo-text">SEmirK <span class="logo-accent">Games</span></span>
      </a>
      <div></div>
      <nav class="header-actions">
        <span class="version-badge">v…</span>
        <a href="../../index.html" class="header-link">←</a>
      </nav>
    </div>
  </header>

  <main class="container game-container slonky-container">
    <div class="slonky-top">
      <div class="s-stat">
        <span class="s-stat-label">Skor</span>
        <span id="score" class="s-stat-value">0</span>
      </div>
      <div class="s-stat">
        <span class="s-stat-label">Top</span>
        <span id="balls" class="s-stat-value">0/10</span>
      </div>
      <div class="s-stat">
        <span class="s-stat-label">Rekor</span>
        <span id="best" class="s-stat-value">0</span>
      </div>
    </div>

    <div class="slonky-stage">
      <canvas id="board" width="400" height="600" aria-label="Slonky tahtası"></canvas>
      <div id="overlay" class="overlay hidden">
        <div class="overlay-content">
          <h2 id="overlayTitle">Slonky</h2>
          <p id="overlayText">Düşürmek için tahtanın üst kısmına dokun.</p>
          <div class="lb-slot" id="leaderboardSlot"></div>
          <button type="button" id="overlayBtn" class="btn btn-primary">Yeni Oyun</button>
        </div>
      </div>
    </div>

    <div class="action-row">
      <button type="button" id="newGameBtn" class="btn btn-primary">Yeni Oyun</button>
    </div>
  </main>

  <script src="../../js/version.js?v=1.25.0"></script>
  <script src="../../js/pwa-back.js?v=1.25.0"></script>
  <script src="../../js/leaderboard.js?v=1.25.0"></script>
  <script src="script.js?v=1.25.0"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <rect width="320" height="200" fill="#020108"/>
  <!-- arka plan yıldızları -->
  <g fill="#fff">
    <circle cx="30" cy="25" r="1.2" opacity="0.6"/>
    <circle cx="90" cy="60" r="0.8" opacity="0.4"/>
    <circle cx="150" cy="20" r="1" opacity="0.5"/>
    <circle cx="230" cy="45" r="1.3" opacity="0.7"/>
    <circle cx="290" cy="25" r="0.8" opacity="0.4"/>
    <circle cx="50" cy="160" r="1" opacity="0.5"/>
    <circle cx="200" cy="175" r="1.2" opacity="0.6"/>
    <circle cx="300" cy="150" r="0.9" opacity="0.4"/>
  </g>
  <!-- sol yıldız (mavi, yörüngeli) -->
  <g>
    <circle cx="80" cy="120" r="30" fill="none" stroke="#00f0ff" stroke-opacity="0.25" stroke-width="8"/>
    <circle cx="80" cy="120" r="16" fill="#00f0ff" opacity="0.9"/>
    <circle cx="80" cy="120" r="8" fill="#fff"/>
    <circle cx="80" cy="120" r="44" fill="none" stroke="#00ff96" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.6"/>
  </g>
  <!-- hedef nova yıldız (altın) -->
  <g>
    <circle cx="245" cy="70" r="14" fill="#ffd700" opacity="0.9"/>
    <circle cx="245" cy="70" r="7" fill="#fff"/>
    <circle cx="245" cy="70" r="26" fill="none" stroke="#ffd700" stroke-opacity="0.3" stroke-width="5"/>
  </g>
  <!-- fırlatma izi + oyuncu -->
  <path d="M104 100 Q160 60 218 74" fill="none" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
  <circle cx="196" cy="72" r="7" fill="#fff"/>
  <circle cx="196" cy="72" r="12" fill="#00f0ff" opacity="0.35"/>
  <!-- nişan çizgisi -->
  <line x1="196" y1="72" x2="238" y2="70" stroke="#00ff96" stroke-width="2" stroke-dasharray="6 6" opacity="0.7"/>
  <!-- asteroid -->
  <polygon points="150,145 165,138 172,150 163,162 149,158" fill="#1a0a0a" stroke="#ff4444" stroke-width="2"/>
  <!-- kristal -->
  <g transform="translate(190,120)">
    <polygon points="0,-9 7,0 0,9 -7,0" fill="#ffd700"/>
    <polygon points="0,-3.5 2.5,0 0,3.5 -2.5,0" fill="#fff"/>
  </g>
  <!-- kara delik -->
  <g>
    <circle cx="286" cy="150" r="15" fill="#000" stroke="#ff00ff" stroke-width="2.5"/>
    <circle cx="286" cy="150" r="8" fill="none" stroke="#ff00ff" stroke-width="1.5" opacity="0.6"/>
  </g>
  <!-- başlık -->
  <text x="160" y="34" font-family="Verdana, sans-serif" font-size="20" font-weight="bold" fill="#00f0ff" text-anchor="middle" letter-spacing="4">NEBULA SLING</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1d29"/>
      <stop offset="1" stop-color="#2a2d49"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" fill="url(#bg)"/>

  <g font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="32" text-anchor="middle" fill="#fff">
    <!-- Row 1 -->
    <rect x="20"  y="20"  width="50" height="50" rx="8" fill="#ef4444"/><text x="45"  y="55">●</text>
    <rect x="75"  y="20"  width="50" height="50" rx="8" fill="#3b82f6"/><text x="100" y="55">■</text>
    <rect x="130" y="20"  width="50" height="50" rx="8" fill="#fbbf24"/><text x="155" y="55">▲</text>
    <rect x="185" y="20"  width="50" height="50" rx="8" fill="#10b981"/><text x="210" y="55">★</text>

    <!-- Row 2: 3 yellows in a row (matched) -->
    <rect x="20"  y="75"  width="50" height="50" rx="8" fill="#fbbf24"/><text x="45"  y="110">▲</text>
    <rect x="75"  y="75"  width="50" height="50" rx="8" fill="#fbbf24"/><text x="100" y="110">▲</text>
    <rect x="130" y="75"  width="50" height="50" rx="8" fill="#fbbf24"/><text x="155" y="110">▲</text>
    <rect x="185" y="75"  width="50" height="50" rx="8" fill="#a855f7"/><text x="210" y="110">◆</text>

    <!-- Glow over matched row -->
    <rect x="18" y="73" width="167" height="54" rx="10" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.7"/>

    <!-- Row 3 -->
    <rect x="20"  y="130" width="50" height="50" rx="8" fill="#3b82f6"/><text x="45"  y="165">■</text>
    <rect x="75"  y="130" width="50" height="50" rx="8" fill="#ef4444"/><text x="100" y="165">●</text>
    <rect x="130" y="130" width="50" height="50" rx="8" fill="#06b6d4"/><text x="155" y="165">✚</text>
    <rect x="185" y="130" width="50" height="50" rx="8" fill="#10b981"/><text x="210" y="165">★</text>

    <!-- Row 4 -->
    <rect x="20"  y="185" width="50" height="50" rx="8" fill="#a855f7"/><text x="45"  y="220">◆</text>
    <rect x="75"  y="185" width="50" height="50" rx="8" fill="#10b981"/><text x="100" y="220">★</text>
    <rect x="130" y="185" width="50" height="50" rx="8" fill="#ef4444"/><text x="155" y="220">●</text>
    <rect x="185" y="185" width="50" height="50" rx="8" fill="#3b82f6"/><text x="210" y="220">■</text>
  </g>
</svg>

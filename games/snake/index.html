<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Yılan - SEmirK Games</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/icons/logo.svg" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="snake-page">
  <a href="../../index.html" class="game-back-fab" aria-label="Tüm Oyunlar">←</a>
  <header class="site-header">
    <div class="header-inner">
      <a href="../../index.html" class="logo">
        <picture>
          <source srcset="../../assets/icons/SemirkLogo.png" type="image/png" />
          <img src="../../assets/icons/logo.svg" alt="SEmirK Games" class="logo-img" />
        </picture>
        <span class="logo-text">SEmirK <span class="logo-accent">Games</span></span>
      </a>
      <div></div>
      <nav class="header-actions">
        <span class="version-badge">v…</span>
        <a href="../../index.html" class="header-link">←</a>
      </nav>
    </div>
  </header>

  <main class="container game-container snake-container">
    <div class="snake-top">
      <div class="sn-stat">
        <span class="sn-stat-label">Skor</span>
        <span id="score" class="sn-stat-value">0</span>
      </div>
      <div class="sn-stat">
        <span class="sn-stat-label">Uzunluk</span>
        <span id="length" class="sn-stat-value">3</span>
      </div>
      <div class="sn-stat">
        <span class="sn-stat-label">Rekor</span>
        <span id="best" class="sn-stat-value">0</span>
      </div>
    </div>

    <div class="snake-stage">
      <canvas id="board" width="420" height="420" aria-label="Yılan tahtası"></canvas>
      <div id="overlay" class="overlay hidden">
        <div class="overlay-content">
          <h2 id="overlayTitle">Yılan</h2>
          <p id="overlayText">Kaydır veya yön tuşlarıyla yönlendir. Yemleri ye, büyü, duvarlara ve kendine çarpma!</p>
          <div class="lb-slot" id="leaderboardSlot"></div>
          <button type="button" id="overlayBtn" class="btn btn-primary">Başla</button>
        </div>
      </div>
    </div>

    <section class="touch-controls" aria-label="Dokunmatik kontroller">
      <button type="button" data-dir="up" class="touch-btn touch-up">↑</button>
      <button type="button" data-dir="left" class="touch-btn touch-left">←</button>
      <button type="button" data-dir="down" class="touch-btn touch-down">↓</button>
      <button type="button" data-dir="right" class="touch-btn touch-right">→</button>
    </section>

    <div class="action-row">
      <button type="button" id="newGameBtn" class="btn btn-primary">Yeni Oyun</button>
      <button type="button" id="pauseBtn" class="btn">Duraklat</button>
    </div>
  </main>

  <script src="../../js/version.js?v=1.11.1"></script>
  <script src="../../js/leaderboard.js?v=1.11.0"></script>
  <script src="script.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6c5ce7"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" fill="url(#bg)"/>

  <!-- Big emoji glyph in center -->
  <g font-family="-apple-system, Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" text-anchor="middle">
    <text x="80"  y="100" font-size="64">☕</text>
    <text x="160" y="100" font-size="64">🇹🇷</text>
  </g>

  <!-- Question mark -->
  <g font-family="Helvetica, Arial, sans-serif" font-weight="900" text-anchor="middle">
    <circle cx="120" cy="170" r="36" fill="#fff" opacity="0.95"/>
    <text x="120" y="187" font-size="48" fill="#6c5ce7">?</text>
  </g>

  <!-- Title corner -->
  <g font-family="Helvetica, Arial, sans-serif" font-weight="800" fill="#fff">
    <text x="14" y="32" font-size="18" opacity="0.85">EMOJI</text>
    <text x="14" y="52" font-size="18">QUIZ</text>
  </g>
</svg>

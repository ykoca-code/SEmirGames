<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Emoji Quiz - SEmirK Games</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/icons/logo.svg" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="emoji-page">
  <a href="../../index.html" class="game-back-fab" aria-label="Tüm Oyunlar">←</a>
  <header class="site-header">
    <div class="header-inner">
      <a href="../../index.html" class="logo">
        <picture>
          <source srcset="../../assets/icons/SemirkLogo.png" type="image/png" />
          <img src="../../assets/icons/logo.svg" alt="SEmirK Games" class="logo-img" />
        </picture>
        <span class="logo-text">SEmirK <span class="logo-accent">Games</span></span>
      </a>
      <div></div>
      <nav class="header-actions">
        <span class="version-badge">v…</span>
        <a href="../../index.html" class="header-link">←</a>
      </nav>
    </div>
  </header>

  <main class="container game-container emoji-container">
    <div class="emoji-top">
      <div class="e-stat">
        <span class="e-stat-label">Soru</span>
        <span id="qNum" class="e-stat-value">0/10</span>
      </div>
      <div class="e-stat">
        <span class="e-stat-label">Skor</span>
        <span id="score" class="e-stat-value">0</span>
      </div>
      <div class="e-stat">
        <span class="e-stat-label">Seri</span>
        <span id="streak" class="e-stat-value">0</span>
      </div>
      <div class="e-stat">
        <span class="e-stat-label">Rekor</span>
        <span id="best" class="e-stat-value">0</span>
      </div>
    </div>

    <div class="emoji-stage">
      <div class="category-pill" id="categoryPill">…</div>
      <div class="emoji-display" id="emojiDisplay">🎮</div>
      <div class="prompt-text">Bu ne olabilir?</div>
      <div class="timer-bar-wrap">
        <div id="timerBar" class="timer-bar"></div>
      </div>
    </div>

    <div class="choices" id="choices">
      <button type="button" class="choice" data-idx="0">…</button>
      <button type="button" class="choice" data-idx="1">…</button>
      <button type="button" class="choice" data-idx="2">…</button>
      <button type="button" class="choice" data-idx="3">…</button>
    </div>

    <div class="action-row">
      <button type="button" id="hintBtn" class="btn hint-btn">💡 İpucu (−15)</button>
      <button type="button" id="newGameBtn" class="btn btn-primary">Yeni Oyun</button>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-content">
        <h2 id="overlayTitle">Emoji Quiz</h2>
        <p id="overlayText">Türk yemekleri, şehirleri, filmleri, deyimleri ve daha fazlası. Emoji ipuçlarından doğru cevabı seç!</p>
        <div class="category-select" id="catSelectWrap">
          <div class="cat-label">Kategori</div>
          <div class="cat-chips" id="catChips"></div>
        </div>
        <div class="lb-slot" id="leaderboardSlot"></div>
        <button type="button" id="overlayBtn" class="btn btn-primary">Başla</button>
      </div>
    </div>
  </main>

  <script src="../../js/version.js?v=1.16.0"></script>
  <script src="../../js/leaderboard.js?v=1.16.0"></script>
  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>

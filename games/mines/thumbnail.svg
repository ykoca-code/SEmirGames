<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <rect width="240" height="240" fill="#1a1d29"/>
  <g font-family="Helvetica,Arial,sans-serif" font-weight="800" text-anchor="middle">
    <!-- 5x5 grid of cells -->
    <g stroke="#0d0f18" stroke-width="2">
      <!-- Row 1 -->
      <rect x="20"  y="20"  width="40" height="40" fill="#cbd5e1"/>
      <rect x="60"  y="20"  width="40" height="40" fill="#cbd5e1"/>
      <rect x="100" y="20"  width="40" height="40" fill="#94a3b8"/>
      <rect x="140" y="20"  width="40" height="40" fill="#cbd5e1"/>
      <rect x="180" y="20"  width="40" height="40" fill="#94a3b8"/>
      <!-- Row 2 -->
      <rect x="20"  y="60"  width="40" height="40" fill="#cbd5e1"/>
      <rect x="60"  y="60"  width="40" height="40" fill="#cbd5e1"/>
      <rect x="100" y="60"  width="40" height="40" fill="#94a3b8"/>
      <rect x="140" y="60"  width="40" height="40" fill="#cbd5e1"/>
      <rect x="180" y="60"  width="40" height="40" fill="#cbd5e1"/>
      <!-- Row 3 -->
      <rect x="20"  y="100" width="40" height="40" fill="#cbd5e1"/>
      <rect x="60"  y="100" width="40" height="40" fill="#94a3b8"/>
      <rect x="100" y="100" width="40" height="40" fill="#94a3b8"/>
      <rect x="140" y="100" width="40" height="40" fill="#94a3b8"/>
      <rect x="180" y="100" width="40" height="40" fill="#cbd5e1"/>
      <!-- Row 4 -->
      <rect x="20"  y="140" width="40" height="40" fill="#cbd5e1"/>
      <rect x="60"  y="140" width="40" height="40" fill="#cbd5e1"/>
      <rect x="100" y="140" width="40" height="40" fill="#94a3b8"/>
      <rect x="140" y="140" width="40" height="40" fill="#cbd5e1"/>
      <rect x="180" y="140" width="40" height="40" fill="#cbd5e1"/>
      <!-- Row 5 -->
      <rect x="20"  y="180" width="40" height="40" fill="#94a3b8"/>
      <rect x="60"  y="180" width="40" height="40" fill="#cbd5e1"/>
      <rect x="100" y="180" width="40" height="40" fill="#cbd5e1"/>
      <rect x="140" y="180" width="40" height="40" fill="#cbd5e1"/>
      <rect x="180" y="180" width="40" height="40" fill="#cbd5e1"/>
    </g>
    <!-- Numbers in revealed cells -->
    <g font-size="22">
      <text x="40"  y="48"  fill="#3b82f6">1</text>
      <text x="80"  y="48"  fill="#10b981">2</text>
      <text x="160" y="48"  fill="#3b82f6">1</text>
      <text x="40"  y="88"  fill="#3b82f6">1</text>
      <text x="80"  y="88"  fill="#f59e0b">3</text>
      <text x="160" y="88"  fill="#10b981">2</text>
      <text x="200" y="88"  fill="#3b82f6">1</text>
      <text x="40"  y="128" fill="#3b82f6">1</text>
      <text x="200" y="128" fill="#3b82f6">1</text>
      <text x="80"  y="168" fill="#3b82f6">1</text>
      <text x="160" y="168" fill="#3b82f6">1</text>
      <text x="80"  y="208" fill="#3b82f6">1</text>
    </g>
    <!-- Mine in middle cell -->
    <circle cx="120" cy="120" r="10" fill="#0d0f18"/>
    <!-- Flag on top-left -->
    <g transform="translate(120 20)">
      <rect x="-2" y="6" width="3" height="28" fill="#0d0f18"/>
      <path d="M 1 8 L 14 13 L 1 18 Z" fill="#ef4444"/>
    </g>
  </g>
</svg>

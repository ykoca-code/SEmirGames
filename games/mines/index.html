<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mayın Tarlası - SEmirK Games</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/icons/logo.svg" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="mines-page">
  <a href="../../index.html" class="game-back-fab" aria-label="Tüm Oyunlar">←</a>
  <header class="site-header">
    <div class="header-inner">
      <a href="../../index.html" class="logo">
        <picture>
          <source srcset="../../assets/icons/SemirkLogo.png" type="image/png" />
          <img src="../../assets/icons/logo.svg" alt="SEmirK Games" class="logo-img" />
        </picture>
        <span class="logo-text">SEmirK <span class="logo-accent">Games</span></span>
      </a>
      <div></div>
      <nav class="header-actions">
        <span class="version-badge">v…</span>
        <a href="../../index.html" class="header-link">←</a>
      </nav>
    </div>
  </header>

  <main class="container game-container mines-container">
    <div class="mines-top">
      <div class="m-stat">
        <span class="m-stat-label">Süre</span>
        <span id="timer" class="m-stat-value">00:00</span>
      </div>
      <div class="m-stat">
        <span class="m-stat-label">Mayın</span>
        <span id="minesLeft" class="m-stat-value">10</span>
      </div>
    </div>

    <div class="mode-row">
      <button type="button" class="mode-btn active" data-mode="reveal">🔍 Aç</button>
      <button type="button" class="mode-btn" data-mode="flag">🚩 Bayrak Koy</button>
    </div>

    <div class="mines-board-wrap">
      <div id="board" class="mines-board" aria-label="Mayın tarlası"></div>
    </div>

    <div class="action-row">
      <select id="difficulty" class="diff-select">
        <option value="easy">Kolay (9×9 · 10)</option>
        <option value="medium" selected>Orta (12×12 · 22)</option>
        <option value="hard">Zor (14×14 · 38)</option>
      </select>
      <button type="button" id="newGameBtn" class="btn btn-primary">Yeni Oyun</button>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-content">
        <h2 id="overlayTitle">Mayın Tarlası</h2>
        <p id="overlayText">Tüm güvenli kareleri aç, mayınlara dokunma!</p>
        <div class="lb-slot" id="leaderboardSlot"></div>
        <button type="button" id="overlayBtn" class="btn btn-primary">Başla</button>
      </div>
    </div>
  </main>

  <script src="../../js/version.js?v=1.23.1"></script>
  <script src="../../js/leaderboard.js?v=1.23.1"></script>
  <script src="script.js?v=1.23.1"></script>
</body>
</html>

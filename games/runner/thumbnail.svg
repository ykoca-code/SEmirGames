<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" fill="url(#sky)"/>
  <!-- clouds -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="40" cy="40" r="10"/>
    <circle cx="50" cy="36" r="12"/>
    <circle cx="60" cy="40" r="10"/>
    <circle cx="180" cy="60" r="9"/>
    <circle cx="188" cy="56" r="11"/>
    <circle cx="196" cy="60" r="9"/>
  </g>
  <!-- school silhouette -->
  <g fill="#a07a4a" opacity="0.45">
    <rect x="150" y="120" width="50" height="60"/>
    <rect x="155" y="100" width="40" height="80"/>
    <polygon points="155,100 175,82 195,100"/>
  </g>
  <!-- ground -->
  <rect x="0" y="180" width="240" height="60" fill="#7c5e3a"/>
  <line x1="0" y1="180" x2="240" y2="180" stroke="#3f2d1a" stroke-width="2"/>
  <g fill="rgba(63,45,26,0.5)">
    <rect x="0" y="190" width="20" height="2"/>
    <rect x="40" y="190" width="20" height="2"/>
    <rect x="80" y="190" width="20" height="2"/>
    <rect x="120" y="190" width="20" height="2"/>
    <rect x="160" y="190" width="20" height="2"/>
    <rect x="200" y="190" width="20" height="2"/>
  </g>
  <!-- student (jumping) -->
  <g transform="translate(60,130)">
    <!-- shadow -->
    <ellipse cx="0" cy="55" rx="14" ry="3" fill="rgba(0,0,0,0.2)"/>
    <!-- backpack -->
    <rect x="-15" y="15" width="8" height="20" rx="2" fill="#dc2626"/>
    <!-- body -->
    <rect x="-10" y="15" width="20" height="26" fill="#1e40af"/>
    <!-- head -->
    <circle cx="0" cy="5" r="9" fill="#fde68a"/>
    <!-- hair -->
    <path d="M -9 5 A 9 9 0 0 1 9 5 L 9 0 L -9 0 Z" fill="#1f2937"/>
    <!-- eye -->
    <rect x="3" y="3" width="2" height="2" fill="#1f2937"/>
    <!-- tucked legs -->
    <rect x="-8" y="35" width="16" height="6" fill="#1f2937"/>
  </g>
  <!-- approaching obstacle: book -->
  <g transform="translate(140,150)">
    <rect width="26" height="38" fill="#3b82f6"/>
    <rect x="3" y="6" width="20" height="2" fill="#dbeafe"/>
    <rect x="3" y="12" width="18" height="2" fill="#dbeafe"/>
    <text x="13" y="32" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="900" text-anchor="middle" fill="#ffffff">📚</text>
  </g>
  <!-- BÜTE sign in distance -->
  <g transform="translate(200,124)">
    <rect x="14" y="22" width="3" height="34" fill="#92400e"/>
    <rect width="30" height="22" fill="#facc15" stroke="#713f12" stroke-width="1.5"/>
    <text x="15" y="16" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="900" text-anchor="middle" fill="#7c2d12">BÜTE</text>
  </g>
  <!-- score badge -->
  <g transform="translate(8,8)">
    <rect width="62" height="22" rx="4" fill="#1e40af"/>
    <text x="31" y="16" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="900" text-anchor="middle" fill="#fff">SKOR 999</text>
  </g>
</svg>

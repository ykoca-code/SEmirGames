<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sınavdan Kaçış - SEmirK Games</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/icons/logo.svg" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="runner-page">
  <a href="../../index.html" class="game-back-fab" aria-label="Tüm Oyunlar">←</a>

  <main class="container game-container runner-container">
    <div class="runner-top">
      <div class="r-stat"><span class="r-stat-label">Skor</span><span id="score" class="r-stat-value">0</span></div>
      <div class="r-stat"><span class="r-stat-label">Rekor</span><span id="best" class="r-stat-value">0</span></div>
      <div class="r-stat"><span class="r-stat-label">Hız</span><span id="speed" class="r-stat-value">1×</span></div>
    </div>

    <div class="runner-stage">
      <canvas id="board" width="360" height="500" aria-label="Sınavdan Kaçış sahnesi"></canvas>
      <div id="overlay" class="overlay hidden">
        <div class="overlay-content">
          <h2 id="overlayTitle">Sınavdan Kaçış</h2>
          <p id="overlayText">Sınavlardan ve kitaplardan kaçıyorsun!
Zıplamak için ekrana dokun veya Space tuşuna bas.
Uçan engellerin altından geçmek için ↓ tuşuna bas.</p>
          <div class="lb-slot" id="leaderboardSlot"></div>
          <button type="button" id="overlayBtn" class="btn btn-primary">Başla</button>
        </div>
      </div>
    </div>

    <div class="touch-pad">
      <button type="button" id="jumpBtn" class="touch-btn">⤴ Zıpla</button>
      <button type="button" id="duckBtn" class="touch-btn">⤵ Eğil</button>
    </div>

    <div class="action-row">
      <button type="button" id="newGameBtn" class="btn btn-primary">Yeni Oyun</button>
      <button type="button" id="pauseBtn" class="btn">Duraklat</button>
    </div>
  </main>

  <script src="../../js/version.js?v=1.24.1"></script>
  <script src="../../js/pwa-back.js?v=1.24.1"></script>
  <script src="../../js/leaderboard.js?v=1.24.1"></script>
  <script src="script.js?v=1.24.1"></script>
</body>
</html>

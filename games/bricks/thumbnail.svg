<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <rect width="240" height="240" fill="#0d0f18"/>
  <!-- bricks rows -->
  <g stroke="#0d0f18" stroke-width="1.5">
    <rect x="14" y="20" width="36" height="18" rx="3" fill="#ef4444"/>
    <rect x="54" y="20" width="36" height="18" rx="3" fill="#f59e0b"/>
    <rect x="94" y="20" width="36" height="18" rx="3" fill="#84cc16"/>
    <rect x="134" y="20" width="36" height="18" rx="3" fill="#06b6d4"/>
    <rect x="174" y="20" width="52" height="18" rx="3" fill="#a855f7"/>

    <rect x="14" y="42" width="36" height="18" rx="3" fill="#f59e0b"/>
    <rect x="54" y="42" width="36" height="18" rx="3" fill="#84cc16"/>
    <rect x="94" y="42" width="36" height="18" rx="3" fill="#1f2937"/>
    <rect x="134" y="42" width="36" height="18" rx="3" fill="#a855f7"/>
    <rect x="174" y="42" width="52" height="18" rx="3" fill="#ef4444"/>

    <rect x="14" y="64" width="36" height="18" rx="3" fill="#06b6d4"/>
    <rect x="54" y="64" width="36" height="18" rx="3" fill="#1f2937"/>
    <rect x="94" y="64" width="36" height="18" rx="3" fill="#84cc16"/>
    <rect x="134" y="64" width="36" height="18" rx="3" fill="#f59e0b"/>
    <rect x="174" y="64" width="52" height="18" rx="3" fill="#06b6d4"/>
  </g>

  <!-- bomb brick icon -->
  <g transform="translate(112,53)">
    <circle r="6" fill="#fef3c7"/>
    <text y="3" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle">💣</text>
  </g>

  <!-- balls -->
  <circle cx="80" cy="150" r="8" fill="#fbbf24"/>
  <circle cx="120" cy="130" r="8" fill="#fbbf24" opacity="0.75"/>
  <circle cx="160" cy="160" r="8" fill="#fbbf24" opacity="0.5"/>

  <!-- power-up falling -->
  <rect x="106" y="178" width="28" height="14" rx="4" fill="#22c55e"/>
  <text x="120" y="190" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="900" text-anchor="middle" fill="#052e16">×3</text>

  <!-- paddle -->
  <rect x="70" y="208" width="100" height="12" rx="6" fill="#3b82f6"/>
  <rect x="76" y="210" width="88" height="3" rx="1.5" fill="#93c5fd"/>
</svg>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Kule Kur - SEmirK Games</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/icons/logo.svg" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="tower-page">
  <a href="../../index.html" class="game-back-fab" aria-label="Tüm Oyunlar">←</a>

  <main class="container game-container tower-container">
    <div class="tower-top">
      <div class="t-stat"><span class="t-stat-label">Seviye</span><span id="level" class="t-stat-value">1</span></div>
      <div class="t-stat"><span class="t-stat-label">Blok</span><span id="blocks" class="t-stat-value">0/5</span></div>
      <div class="t-stat"><span class="t-stat-label">Skor</span><span id="score" class="t-stat-value">0</span></div>
      <div class="t-stat"><span class="t-stat-label">Rekor</span><span id="best" class="t-stat-value">0</span></div>
    </div>

    <div class="tower-stage">
      <canvas id="board" width="320" height="540" aria-label="Kule sahnesi"></canvas>
      <div id="overlay" class="overlay hidden">
        <div class="overlay-content">
          <h2 id="overlayTitle">Kule Kur</h2>
          <p id="overlayText">Vinç sağa sola sallanır.
Tam doğru anda dokun → blok düşer ve üst üste binmeli!
Kayma olursa blok incelir. Tamamen kaçırırsan kule yıkılır.
20 seviye, her seviyede vinç daha hızlı.</p>
          <div class="lb-slot" id="leaderboardSlot"></div>
          <button type="button" id="overlayBtn" class="btn btn-primary">Başla</button>
        </div>
      </div>
    </div>

    <div class="action-row">
      <button type="button" id="newGameBtn" class="btn btn-primary">Yeni Oyun</button>
      <button type="button" id="dropBtn" class="btn">Bırak</button>
    </div>
  </main>

  <script src="../../js/version.js?v=1.21.0"></script>
  <script src="../../js/leaderboard.js?v=1.21.0"></script>
  <script src="script.js?v=1.21.0"></script>
</body>
</html>

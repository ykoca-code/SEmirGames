<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2b4a"/>
      <stop offset="1" stop-color="#2d4a7a"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#fff" opacity="0.6">
    <rect x="40" y="20" width="2" height="2"/>
    <rect x="190" y="35" width="2" height="2"/>
    <rect x="150" y="50" width="1.5" height="1.5"/>
    <rect x="60" y="80" width="1.5" height="1.5"/>
    <rect x="200" y="100" width="2" height="2"/>
  </g>
  <!-- crane rail -->
  <rect x="20" y="22" width="200" height="5" fill="#6b7280"/>
  <!-- rope -->
  <line x1="135" y1="27" x2="135" y2="60" stroke="#9ca3af" stroke-width="1.5"/>
  <!-- swinging block at top -->
  <rect x="113" y="60" width="44" height="20" rx="2" fill="#a855f7"/>
  <rect x="115" y="62" width="40" height="3" fill="rgba(255,255,255,0.3)"/>
  <!-- alignment dashed line -->
  <line x1="135" y1="80" x2="135" y2="115" stroke="rgba(255,255,255,0.18)" stroke-width="1" stroke-dasharray="3 4"/>
  <!-- tower (bottom to top, blocks getting narrower) -->
  <g stroke="rgba(0,0,0,0.35)" stroke-width="0.5">
    <rect x="80" y="200" width="80" height="20" rx="2" fill="#475569"/>
    <rect x="83" y="180" width="72" height="20" rx="2" fill="#ef4444"/>
    <rect x="89" y="160" width="64" height="20" rx="2" fill="#f59e0b"/>
    <rect x="92" y="140" width="60" height="20" rx="2" fill="#84cc16"/>
    <rect x="96" y="120" width="56" height="20" rx="2" fill="#06b6d4"/>
    <rect x="100" y="100" width="48" height="20" rx="2" fill="#3b82f6"/>
  </g>
  <!-- combo badge -->
  <g transform="translate(20,210)">
    <rect width="60" height="22" rx="4" fill="#22c55e"/>
    <text x="30" y="16" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="900" text-anchor="middle" fill="#fff">KOMBO×3</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <rect width="320" height="200" fill="#0a0a1a"/>
  <!-- ızgara -->
  <g stroke="#0ff" stroke-width="0.5" opacity="0.12">
    <line x1="0" y1="50" x2="320" y2="50"/><line x1="0" y1="100" x2="320" y2="100"/><line x1="0" y1="150" x2="320" y2="150"/>
    <line x1="60" y1="0" x2="60" y2="200"/><line x1="130" y1="0" x2="130" y2="200"/><line x1="200" y1="0" x2="200" y2="200"/><line x1="270" y1="0" x2="270" y2="200"/>
  </g>
  <!-- arka plan binalar -->
  <g fill="#0a0a2e" stroke="#0ff" stroke-opacity="0.25" stroke-width="1">
    <rect x="20" y="90" width="40" height="70"/>
    <rect x="240" y="70" width="45" height="90"/>
    <rect x="150" y="100" width="35" height="60"/>
  </g>
  <!-- zemin -->
  <rect x="0" y="160" width="320" height="40" fill="#0a0a2e"/>
  <line x1="0" y1="160" x2="320" y2="160" stroke="#0ff" stroke-width="2"/>
  <!-- platform -->
  <rect x="200" y="112" width="80" height="12" fill="#0f0f2a" stroke="#ff0080" stroke-width="2"/>
  <!-- düşman (walker) -->
  <g transform="translate(250,138)">
    <rect x="-11" y="-11" width="22" height="22" fill="#0a0a1a" stroke="#00ff44" stroke-width="2"/>
    <rect x="-4" y="-4" width="8" height="8" fill="#00ff44"/>
  </g>
  <!-- neon küre -->
  <circle cx="180" cy="80" r="8" fill="#ffd700"/>
  <circle cx="177" cy="77" r="3" fill="#fff"/>
  <!-- oyuncu (dash izli) -->
  <g transform="translate(90,105)">
    <rect x="-38" y="-14" width="16" height="26" fill="#ff0080" opacity="0.25"/>
    <rect x="-24" y="-14" width="14" height="26" fill="#ff0080" opacity="0.4"/>
    <rect x="-10" y="-16" width="20" height="28" fill="#0a0a2e" stroke="#0ff" stroke-width="2"/>
    <rect x="-9" y="-29" width="18" height="13" fill="#0a0a2e" stroke="#0ff" stroke-width="2"/>
    <rect x="2" y="-25" width="5" height="4" fill="#0ff"/>
    <line x1="-10" y1="-4" x2="10" y2="-4" stroke="#0ff" stroke-width="1.5"/>
    <line x1="-10" y1="4" x2="10" y2="4" stroke="#0ff" stroke-width="1.5"/>
  </g>
  <!-- başlık -->
  <text x="160" y="34" font-family="Verdana, sans-serif" font-size="22" font-weight="bold" fill="#0ff" text-anchor="middle" letter-spacing="6">NEON SHIFT</text>
  <text x="160" y="188" font-family="Verdana, sans-serif" font-size="10" fill="#ff0080" text-anchor="middle" letter-spacing="3">CYBERPUNK PLATFORMER</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#sky)"/>
  <!-- clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="60" cy="38" rx="26" ry="11"/>
    <ellipse cx="80" cy="32" rx="18" ry="9"/>
    <ellipse cx="240" cy="52" rx="30" ry="12"/>
  </g>
  <!-- ground -->
  <rect x="0" y="160" width="320" height="40" fill="#8B5A2B"/>
  <rect x="0" y="160" width="320" height="8" fill="#228B22"/>
  <!-- question block -->
  <g>
    <rect x="196" y="84" width="34" height="34" fill="#FFD700" stroke="#B8860B" stroke-width="3"/>
    <text x="213" y="110" font-family="monospace" font-size="24" font-weight="bold" fill="#8B4513" text-anchor="middle">?</text>
  </g>
  <!-- coin -->
  <circle cx="213" cy="58" r="9" fill="#FFD700" stroke="#B8860B" stroke-width="2"/>
  <!-- stone chimney -->
  <g>
    <rect x="262" y="118" width="36" height="42" fill="#8d99ae"/>
    <rect x="258" y="112" width="44" height="14" fill="#adb5bd" stroke="#5c677d" stroke-width="2"/>
    <line x1="262" y1="142" x2="298" y2="142" stroke="#5c677d" stroke-width="2"/>
  </g>
  <!-- slime enemy -->
  <g>
    <path d="M120 160 Q120 138 134 138 Q148 138 148 160 Z" fill="#4ade80"/>
    <ellipse cx="134" cy="159" rx="15" ry="4" fill="#22c55e"/>
    <circle cx="134" cy="149" r="6" fill="#fff"/>
    <circle cx="136" cy="149" r="3" fill="#111"/>
  </g>
  <!-- Zıpzıp character (jumping) -->
  <g transform="translate(52,74)">
    <!-- pompom + beanie -->
    <circle cx="18" cy="-4" r="6" fill="#5eead4"/>
    <path d="M2 10 Q2 -4 18 -4 Q34 -4 34 10 Z" fill="#0d9488"/>
    <rect x="2" y="8" width="32" height="6" fill="#0f766e"/>
    <!-- face -->
    <rect x="4" y="14" width="28" height="16" rx="6" fill="#fcd9b8"/>
    <circle cx="13" cy="20" r="2.5" fill="#111"/>
    <circle cx="23" cy="20" r="2.5" fill="#111"/>
    <path d="M14 26 Q18 29 22 26" stroke="#a05a2c" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- puffer jacket -->
    <rect x="2" y="30" width="32" height="22" rx="7" fill="#f97316"/>
    <line x1="2" y1="38" x2="34" y2="38" stroke="#ea580c" stroke-width="2"/>
    <line x1="2" y1="45" x2="34" y2="45" stroke="#ea580c" stroke-width="2"/>
    <!-- arms up -->
    <rect x="-6" y="24" width="9" height="16" rx="4" fill="#f97316" transform="rotate(24 -1 32)"/>
    <rect x="33" y="24" width="9" height="16" rx="4" fill="#f97316" transform="rotate(-24 37 32)"/>
    <!-- pants + shoes -->
    <rect x="6" y="52" width="10" height="12" rx="3" fill="#1e3a5f"/>
    <rect x="20" y="52" width="10" height="12" rx="3" fill="#1e3a5f"/>
    <rect x="4" y="62" width="13" height="6" rx="3" fill="#374151"/>
    <rect x="19" y="62" width="13" height="6" rx="3" fill="#374151"/>
  </g>
  <!-- title -->
  <text x="160" y="188" font-family="Verdana, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" stroke="#1e3a5f" stroke-width="0.8" text-anchor="middle">SÜPER ZIPZIP</text>
</svg>

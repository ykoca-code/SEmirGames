    <text x="140" y="68" font-family="Arial" font-size="18" text-anchor="middle">♻️</text>
  </g>
  <!-- fabrika -->
  <g>
    <rect x="164" y="84" width="32" height="32" rx="3" fill="#0ea5e9" stroke="rgba(0,0,0,0.4)"/>
    <text x="180" y="108" font-family="Arial" font-size="18" text-anchor="middle">🏭</text>
  </g>
  <!-- güneş paneli -->
  <g>

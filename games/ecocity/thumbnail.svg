    <rect x="124" y="124" width="32" height="32" rx="3" fill="#64748b" stroke="rgba(0,0,0,0.4)"/>
    <text x="140" y="148" font-family="Arial" font-size="18" text-anchor="middle">🏢</text>
  </g>

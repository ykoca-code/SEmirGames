<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" fill="url(#road)"/>
  <!-- lane dividers -->
  <g stroke="#fef3c7" stroke-width="2" stroke-dasharray="10 8" opacity="0.7">
    <line x1="80" y1="0" x2="80" y2="240"/>
    <line x1="160" y1="0" x2="160" y2="240"/>
  </g>
  <!-- coins in left lane -->
  <g>
    <circle cx="40" cy="40" r="10" fill="#fbbf24" stroke="#92400e" stroke-width="2"/>
    <text x="40" y="46" font-family="Helvetica,Arial,sans-serif" font-weight="900" font-size="14" fill="#92400e" text-anchor="middle">₺</text>
  </g>
  <g>
    <circle cx="40" cy="78" r="10" fill="#fbbf24" stroke="#92400e" stroke-width="2"/>
    <text x="40" y="84" font-family="Helvetica,Arial,sans-serif" font-weight="900" font-size="14" fill="#92400e" text-anchor="middle">₺</text>
  </g>
  <!-- cone obstacle middle -->
  <g>
    <path d="M 120 40 L 110 90 L 130 90 Z" fill="#f97316" stroke="#7c2d12" stroke-width="2"/>
    <rect x="106" y="88" width="28" height="6" fill="#f97316" stroke="#7c2d12" stroke-width="2"/>
    <line x1="115" y1="65" x2="125" y2="65" stroke="#fff" stroke-width="2"/>
  </g>
  <!-- barrier in right lane -->
  <g>
    <rect x="180" y="40" width="40" height="14" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/>
    <rect x="180" y="40" width="10" height="14" fill="#fff"/>
    <rect x="200" y="40" width="10" height="14" fill="#fff"/>
  </g>
  <!-- player + scooter -->
  <g transform="translate(120 180)">
    <!-- wheel back -->
    <circle cx="-10" cy="22" r="5" fill="#0f172a" stroke="#fafafa" stroke-width="1.5"/>
    <!-- wheel front -->
    <circle cx="14" cy="22" r="5" fill="#0f172a" stroke="#fafafa" stroke-width="1.5"/>
    <!-- deck -->
    <rect x="-12" y="14" width="28" height="6" rx="3" fill="#0ea5e9"/>
    <!-- handle bar -->
    <rect x="11" y="-12" width="4" height="28" fill="#94a3b8"/>
    <rect x="6" y="-14" width="14" height="4" fill="#94a3b8"/>
    <!-- character body (blue tshirt) -->
    <rect x="-8" y="-8" width="18" height="22" rx="6" fill="#0054b4"/>
    <!-- head -->
    <circle cx="0" cy="-20" r="9" fill="#fca5a5"/>
    <!-- hair -->
    <path d="M -8 -22 Q 0 -32 8 -22" fill="#0c192c"/>
    <!-- eye -->
    <circle cx="-2" cy="-20" r="1.5" fill="#0c192c"/>
    <circle cx="3" cy="-20" r="1.5" fill="#0c192c"/>
    <!-- arm to handle -->
    <line x1="6" y1="-4" x2="14" y2="-8" stroke="#fca5a5" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aee9ff"/>
      <stop offset="0.6" stop-color="#fff3c4"/>
      <stop offset="1" stop-color="#ffd9a0"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" fill="url(#bg)"/>
  <!-- maze board -->
  <rect x="20" y="20" width="200" height="200" rx="14" fill="#fffdf6" stroke="#5c8a5e" stroke-width="2"/>
  <!-- walls (green blocks) -->
  <g fill="#7cc47f" stroke="#5c8a5e" stroke-width="1">
    <rect x="52" y="20" width="24" height="72"/>
    <rect x="108" y="44" width="24" height="80"/>
    <rect x="164" y="20" width="24" height="56"/>
    <rect x="20" y="108" width="60" height="24"/>
    <rect x="108" y="148" width="80" height="24"/>
    <rect x="52" y="164" width="24" height="56"/>
    <rect x="164" y="108" width="24" height="48"/>
  </g>
  <!-- fox (player) top-left -->
  <text x="38" y="46" font-size="26" text-anchor="middle">🦊</text>
  <!-- star -->
  <text x="150" y="46" font-size="20" text-anchor="middle">⭐</text>
  <!-- locked door -->
  <text x="94" y="150" font-size="22" text-anchor="middle">🔒</text>
  <!-- power -->
  <text x="200" y="98" font-size="18" text-anchor="middle">💪</text>
  <!-- monster -->
  <text x="150" y="200" font-size="22" text-anchor="middle">👹</text>
  <!-- goal flag bottom-right -->
  <text x="202" y="206" font-size="24" text-anchor="middle">🏁</text>
  <!-- title badge -->
  <g transform="translate(24,24)">
    <rect width="118" height="24" rx="6" fill="rgba(90,138,94,0.9)"/>
    <text x="59" y="17" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="900" text-anchor="middle" fill="#fff">LABİRENT 🦊</text>
  </g>
</svg>
